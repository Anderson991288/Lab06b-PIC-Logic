<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="t d"><title id="t">theta1 的邏輯驅動與回路</title><desc id="d">theta1相位設定先經待完成的校正才變成DRV00偏壓；由CTRL_theta1連到heater A，經heater B到GND再到DRV_RETURN。實體PAD數量與共地阻抗待後續驗證。</desc><rect width="1120" height="320" fill="#f4f7fc" rx="10"/><g font-family="Microsoft JhengHei,Arial" font-size="18" fill="#17263b" text-anchor="middle"><rect x="20" y="50" width="205" height="80" rx="7" fill="#fff3d7" stroke="#b78019"/><text x="122" y="81">theta1：相位 rad</text><text x="122" y="112">相位→偏壓校正待定</text><rect x="275" y="50" width="170" height="80" rx="7" fill="#e8f5ee" stroke="#258350"/><text x="360" y="82">外部 DRV00</text><text x="360" y="112">不是 π V</text><rect x="505" y="50" width="205" height="80" rx="7" fill="#e3edfc" stroke="#155bd0"/><text x="607" y="82">CTRL_theta1</text><text x="607" y="112">實體 PAD 尚未指派</text><rect x="770" y="50" width="325" height="80" rx="7" fill="white" stroke="#155bd0"/><text x="932" y="82">H_M1_theta：A → B</text><text x="932" y="112">heater 邏輯支路</text><text x="620" y="213">GND 邏輯共地 ← heater B</text><text x="620" y="278">其餘 13 路亦接此邏輯回路；實際 PAD 數及共地阻抗仍待 M2 S5／S6 驗證。</text></g><g stroke="#258350" fill="none" stroke-width="4"><path d="M225 90H270 M445 90H500 M710 90H765 M1030 130V185H360V130"/></g><text x="273" y="210" font-family="Arial" font-size="17" fill="#258350">DRV_RETURN</text></svg>