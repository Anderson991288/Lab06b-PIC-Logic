<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="390" viewBox="0 0 1180 390" role="img" aria-labelledby="t d"><title id="t">PDK MZI 埠位與相位位置</title><desc id="d">上路 in0 先經 phi 再到 MMI1 in2，MMI1 out2 經 theta 到 MMI2 in2；下路 in1 到 MMI1 in1，再從 out1 到 MMI2 in1。輸出上路 out0 對應 MMI2 out2，下路 out1 對應 out1。光線為邏輯連線，沒有長度。</desc><rect width="1180" height="390" rx="10" fill="#f4f7fc"/><g stroke="#155bd0" stroke-width="4" fill="none"><path d="M80 130H330 M80 260H330 M440 130H790 M440 260H790 M900 130H1110 M900 260H1110"/></g><g fill="white" stroke="#155bd0" stroke-width="2"><rect x="330" y="75" width="110" height="240" rx="8"/><rect x="790" y="75" width="110" height="240" rx="8"/></g><g fill="#fff3d7" stroke="#b78019" stroke-width="2"><rect x="170" y="100" width="105" height="60" rx="8"/><rect x="555" y="100" width="105" height="60" rx="8"/></g><g font-family="Microsoft JhengHei,Arial" fill="#17263b" font-size="19" text-anchor="middle"><text x="385" y="194">PDK MMI1</text><text x="845" y="194">PDK MMI2</text><text x="222" y="138">φ · 理想</text><text x="608" y="138">θ · 理想</text><text x="95" y="105">in0 上</text><text x="95" y="300">in1 下</text><text x="1065" y="105">out0 上</text><text x="1065" y="300">out1 下</text><text x="385" y="112">in2 → out2</text><text x="385" y="286">in1 → out1</text><text x="845" y="112">in2 → out2</text><text x="845" y="286">in1 → out1</text><text x="590" y="40" font-size="23">T = H · P(θ) · H · P(φ)，矩陣從右向左作用</text><text x="590" y="365" font-size="17">7 個 MZI → 14 個 PDK MMI＋14 個理想相位元件；藍線是零長度邏輯連線。</text></g></svg>