<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">MZI 共用模型：上埠在前，phi 在輸入，theta 在兩耦合器之間</title><desc id="desc">光沿左至右經上方輸入相位 phi、耦合器 C1、上方內臂相位 theta、耦合器 C2，再得到上方 out0 及下方 out1。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#155bd0"/></marker></defs><rect width="1000" height="300" fill="#f4f7fc" rx="10"/><g fill="none" stroke="#155bd0" stroke-width="4"><path d="M95 85H335 M95 175H335 M410 85H695 M410 175H695 M770 85H895 M770 175H895" marker-end="url(#arrow)"/></g><g fill="#dce8fb" stroke="#155bd0" stroke-width="2"><rect x="340" y="48" width="70" height="164" rx="7"/><rect x="700" y="48" width="70" height="164" rx="7"/></g><rect x="165" y="64" width="115" height="42" fill="#aa5a13" rx="5"/><rect x="505" y="64" width="115" height="42" fill="#173f79" rx="5"/><g font-family="Microsoft JhengHei,Arial" font-size="18" fill="#17263b"><text x="18" y="60">in0 上</text><text x="18" y="207">in1 下</text><text x="900" y="60">out0 上</text><text x="900" y="207">out1 下</text><text x="360" y="135">C₁</text><text x="720" y="135">C₂</text><text x="225" y="255">Eout = a C₂ Pθ C₁ Pφ Ein（最右邊先作用）</text></g><g font-family="Arial" fill="white" font-size="18"><text x="181" y="91">φ (input)</text><text x="513" y="91">θ (internal)</text></g></svg>