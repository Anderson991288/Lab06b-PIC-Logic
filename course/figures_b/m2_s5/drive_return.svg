<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="t d"><title id="t">PAD 到 heater A 與 B 回地的路徑</title><desc id="d">DRV00 經 PAD_DRV00 到 H_M1_theta.A，電流穿過 heater 到 B，再經分欄共地線到兩個共地 PAD 及外部驅動器回流。相位 rad 需要尚未完成的電壓校正。</desc><rect width="1100" height="340" rx="8" fill="#f4f7fc"/><g font-family="Microsoft JhengHei,Arial" text-anchor="middle" font-size="18" fill="#17263b"><rect x="20" y="55" width="170" height="90" rx="7" fill="#fff3d7" stroke="#b78019"/><text x="105" y="90">外部 DRV00</text><text x="105" y="123">偏壓尚待校正</text><rect x="245" y="55" width="200" height="90" rx="7" fill="white" stroke="#155bd0"/><text x="345" y="91">PAD_DRV00</text><text x="345" y="123">theta1，phase 是 rad</text><rect x="500" y="55" width="300" height="90" rx="7" fill="#fff3d7" stroke="#df7c16"/><text x="650" y="91">H_M1_theta：A → B</text><text x="650" y="123">HT 是電阻支路，非金屬短路</text><rect x="850" y="55" width="225" height="90" rx="7" fill="#e8f5ee" stroke="#258350"/><text x="962" y="90">分欄共地金屬</text><text x="962" y="123">單一 GND 網</text><text x="650" y="235">PAD_GND_W／PAD_GND_E → 外部 DRV_RETURN</text><text x="550" y="303">16 個實體 PAD = 14 個訊號＋2 個共地；GDS 41 有 15 個獨立金屬網。</text></g><g fill="none" stroke="#258350" stroke-width="4"><path d="M190 100H240 M445 100H495 M800 100H845 M962 145V190H105V145"/></g></svg>