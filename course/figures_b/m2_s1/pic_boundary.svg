<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">PIC 與外部設備的邊界</title><desc id="d">PIC中規劃五路輸入EC、B7、十四heater及五路輸出EC和金屬端點。外部同源雷射經資料調變與參考相位調整，輸出兩路進PD與差分接收，其餘三路到監測或負載。外部十四路偏壓驅動heater，並共享邏輯回路。</desc><rect width="1200" height="650" rx="10" fill="#f4f7fc"/><rect x="310" y="55" width="565" height="410" rx="12" fill="#e3edfc" stroke="#155bd0" stroke-width="3"/><g font-family="Microsoft JhengHei,Arial" fill="#17263b" text-anchor="middle"><text x="590" y="94" font-size="24">PIC 邊界（規劃；非完成版圖）</text><rect x="330" y="170" width="85" height="200" rx="6" fill="white" stroke="#155bd0"/><text x="372" y="220" font-size="18">輸入 EC</text><text x="372" y="255" font-size="18">5 路</text><text x="372" y="292" font-size="15">in0～4</text><rect x="450" y="170" width="285" height="200" rx="6" fill="white" stroke="#155bd0"/><text x="592" y="215" font-size="23">B7 光學 core</text><text x="592" y="255" font-size="18">7 MZI · 6 段直通</text><text x="592" y="292" font-size="18">14 個相位 heater</text><text x="592" y="328" font-size="16">θ／φ 位置承接 M1 規格</text><rect x="770" y="170" width="85" height="200" rx="6" fill="white" stroke="#155bd0"/><text x="812" y="220" font-size="18">輸出 EC</text><text x="812" y="255" font-size="18">5 路</text><text x="812" y="292" font-size="15">out0～4</text><text x="592" y="418" font-size="18">金屬走線／PAD：後續實作；此處僅定義邏輯端點</text><rect x="20" y="75" width="240" height="70" rx="7" fill="white" stroke="#7c8fa8"/><text x="140" y="117" font-size="20">外部同源雷射／分光</text><rect x="20" y="190" width="240" height="170" rx="7" fill="white" stroke="#7c8fa8"/><text x="140" y="232" font-size="18">四路資料調變 x1～x4</text><text x="140" y="271" font-size="18">參考光 R 振幅／相位</text><text x="140" y="310" font-size="17">相對相位調整／穩定</text><rect x="925" y="165" width="250" height="135" rx="7" fill="white" stroke="#7c8fa8"/><text x="1050" y="203" font-size="19">外部 PD＋／PD−</text><text x="1050" y="241" font-size="18">TIA／校正／比較器</text><text x="1050" y="276" font-size="17">out1 正 · out3 負</text><rect x="925" y="340" width="250" height="75" rx="7" fill="white" stroke="#7c8fa8"/><text x="1050" y="371" font-size="17">out0／2／4 不消失</text><text x="1050" y="397" font-size="17">外部監測或負載路徑</text><rect x="350" y="525" width="480" height="75" rx="7" fill="#e8f5ee" stroke="#258350"/><text x="590" y="555" font-size="19">外部 14 路校正後偏壓驅動器</text><text x="590" y="583" font-size="17">14 個驅動端點＋GND 邏輯共地（非 PAD 數）</text></g><g fill="none" stroke="#155bd0" stroke-width="4"><path d="M140 145V185 M260 270H325 M415 270H445 M735 270H765 M855 235H920 M855 350H900V377H920"/></g><g fill="none" stroke="#258350" stroke-width="4" stroke-dasharray="9 5"><path d="M540 525V470 M640 470V525"/></g><g font-family="Microsoft JhengHei,Arial" fill="#526379" font-size="16"><text x="25" y="630">藍線：光學訊號；綠虛線：偏壓／回路。EC、heater、PAD 與接收校正均未在本步完成實體驗證。</text></g></svg>