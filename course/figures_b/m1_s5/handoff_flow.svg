<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="t d"><title id="t">M1 邏輯規格交接 M2</title><desc id="d">M1相位與驗收產生規格和相位檔，打包本地模型及表格，在獨立目錄重播80筆，再交給M2完成PDK與幾何。邏輯通道有名稱，PAD和heater校正待定。</desc><rect width="1100" height="350" fill="#f4f7fc" rx="10"/><g fill="#e3edfc" stroke="#155bd0" stroke-width="2"><rect x="20" y="60" width="225" height="160" rx="8"/><rect x="300" y="60" width="225" height="160" rx="8"/><rect x="580" y="60" width="225" height="160" rx="8"/></g><rect x="860" y="60" width="220" height="160" rx="8" fill="#fff3d7" stroke="#b78019" stroke-width="2"/><g font-family="Microsoft JhengHei,Arial" font-size="19" fill="#17263b" text-anchor="middle"><text x="132" y="97">M1 已驗證資料</text><text x="132" y="137">5 組相位 · 80 筆真值</text><text x="132" y="176">固定光路與判讀</text><text x="412" y="97">交接規格與檔案綁定</text><text x="412" y="137">10 光學埠 · 14 通道</text><text x="412" y="176" font-size="16">spec SHA-256 ↔ phases</text><text x="692" y="97">獨立目錄重播</text><text x="692" y="137">只讀包內模型與表格</text><text x="692" y="176">80/80 · 無父層課程依賴</text><text x="970" y="97">M2 待實作</text><text x="970" y="137">PDK · 光路 · heater</text><text x="970" y="176">EC／PAD · DRC／連接</text></g><g stroke="#155bd0" stroke-width="4" fill="#155bd0"><path d="M250 140H285 M530 140H565 M810 140H845"/><path d="M278 133L288 140L278 147 M558 133L568 140L558 147 M838 133L848 140L838 147"/></g><g font-family="Microsoft JhengHei,Arial" font-size="18" fill="#526379"><text x="28" y="272">theta1 → M1 上臂相位 → H_M1_theta（邏輯名稱）→ PAD 與校正：M2 待定</text><text x="28" y="313">交接完成的是邏輯介面與可重播資料；不表示已建立實體 PIC 或通過 PDK／製程簽核。</text></g></svg>